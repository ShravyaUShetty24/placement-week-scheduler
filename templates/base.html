<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Placement Week Scheduler
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <nav class="navbar">

        <div class="nav-brand">
            Placement Week Scheduler
        </div>

        <div class="nav-links">

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('schedule') }}">
                Schedule
            </a>

            <a href="{{ url_for('disruptions') }}">
                Disruptions
            </a>

        </div>

    </nav>


    <main class="main-container">

        {% block content %}
        {% endblock %}

    </main>


    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>

</body>

</html>
